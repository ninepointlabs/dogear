[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dogear"
version = "0.1.2"
description = "An Omarchy-native PDF reader for study: highlight, annotate, bookmark, export to Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nine Point Labs" }]
requires-python = ">=3.12"
# PySide6 (with QtPdf) is intentionally not listed: on Arch it comes from the
# official `pyside6` package, which pip cannot see. No other runtime deps.
dependencies = []

[project.urls]
Homepage = "https://dogear.ninepointlabs.com"
Source = "https://github.com/ninepointlabs/dogear"

[project.scripts]
dogear = "dogear.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dogear = ["qml/**/*", "qml/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
