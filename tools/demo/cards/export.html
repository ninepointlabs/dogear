<!DOCTYPE html>
<!-- The exported Markdown, shown as a note in a vault. make_media.py fills
     in #EXPORT# with the real export and renders it at 1920×1080. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Literata:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(ellipse 60% 55% at 50% 30%, rgba(245, 213, 71, 0.07), transparent 70%), #0f121a;
         font-family: 'Literata', serif; color: #f4f1e8; display: flex; align-items: center; justify-content: center; }
  .window { width: 1480px; height: 900px; background: #171b26; border: 1px solid #384056; border-radius: 10px;
            box-shadow: 0 30px 90px rgba(0,0,0,0.55); overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid #262c3a;
         font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #a9afbd; }
  .bar b { color: #f5d547; font-weight: 500; }
  pre { margin: 0; padding: 30px 40px; font-family: 'JetBrains Mono', monospace; font-size: 21px; line-height: 1.5;
        color: #dcd8cc; white-space: pre-wrap; flex: 1; overflow: hidden;
        mask-image: linear-gradient(black 82%, transparent); }
  .k { color: #6b7386; } .h { color: #f5d547; font-weight: 500; } .q { color: #8fb0ff; } .a { color: #8cc08a; }
</style>
</head>
<body>
<div class="window">
  <div class="bar"><b>●</b> Notes / #FILE#</div>
  <pre>#EXPORT#</pre>
</div>
</body>
</html>
